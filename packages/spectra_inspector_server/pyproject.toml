[project]
name = "spectra_inspector_server"
version = "0.1.0"
authors = [{ name = "Chris Havlin", email = "chris.havlin@gmail.com" }]
description = "backend server for the spectra_inspector"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "exspy>=0.3.2",
  "fastapi[standard]>=0.129.0",
  "matplotlib>=3.10.8",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "rosettasciio>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/chrishavlin/spectra_inspector"
"Bug Tracker" = "https://github.com/chrishavlin/spectra_inspector/issues"
Discussions = "https://github.com/chrishavlin/spectra_inspector/discussions"
Changelog = "https://github.com/chrishavlin/spectra_inspector/releases"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project.optional-dependencies]
examples = ["matplotlib", "jupyterlab"]

[dependency-groups]
test = [
 "httpx2>=2.3.0",
 "pytest >=9",
 "pytest-cov >=7",
]
lint = ["pre-commit"]
dev = [{ include-group = "test" }, { include-group ="lint" }]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]
typing = ["mypy", "pandas-stubs"]

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests", "src/spectra_inspector_server"]


[tool.coverage]
run.source = ["spectra_inspector_server"]
report.exclude_also = ['\.\.\.', 'if typing.TYPE_CHECKING:']

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
python_version = "3.10"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_untyped_imports = true


[[tool.mypy.overrides]]
module = "spectra_inspector_server.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]

[tool.ruff.lint]
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PTH123",  # replace open() with Path.open()
  "PD015",   # pandas Use `df.merge` instead of `pd.merge`
  "RET504",  # unnecesarry-assign
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["spectra_inspector_server._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]


[tool.pylint]
py-version = "3.10"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]
