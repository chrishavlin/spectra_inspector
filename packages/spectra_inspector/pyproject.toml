[project]
name = "spectra-inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "chrishavlin", email = "chris.havlin@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "dash>=4.0.0",
  "dash-bootstrap-components>=2.0.4",
  "dash-bootstrap-templates>=2.1.0",
  "fpdf2>=2.8.7",
  "kaleido>=1.2.0",
  "pandas>=3.0.1",
  "plotly>=6.6.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "rosettasciio>=0.13.0",
  "unyt>=3.1.0",
]

[project.scripts]
spectra-inspector = "spectra_inspector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=9.0.2", "pytest-mock>=3.15.1"]
lint = ["pre-commit>=4.5.1"]
dev = [{ include-group = "test" }, { include-group = "lint" }]


[tool.ruff]

[tool.ruff.lint]
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PTH123",  # replace open() with Path.open()
  "RET504",  # unnecessary-assign (sometimes its nice actually)
  "SIM108",  # use if-else ternary operator
  "PLC0415", # top-level imports only
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["spectra_inspector_server._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]


[tool.pylint]
py-version = "3.10"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]
