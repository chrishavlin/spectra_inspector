# Service definitions shared by every mode. Running `docker compose` here also
# picks up compose.override.yaml (the development overlay) automatically; a
# deployment layers compose.prod.yaml instead, which is what
# `./start_docker.sh prod` does. Neither service publishes a port in this file:
# the overlays decide what is reachable from the host.
#
# ${...} references are interpolated from the two packages' .env files, which
# the start/stop scripts pass with --env-file. The same files are handed to the
# containers through env_file, so a configuration change needs a restart, not a
# rebuild.
services:
  frontend:
    build: ./packages/spectra_inspector/
    env_file: ./packages/spectra_inspector/.env
    environment:
      # The backend is reached by service name over the compose network, never
      # through a host port, and downloads are staged inside the container
      # (the .env values for both are meant for running outside docker).
      - SPECTRA_INSPECTOR_SERVER_HOST=fastapi
      - SPECTRA_INSPECTOR_SERVER_PORT=8000
      - SPECTRA_INSPECTOR_WRITE_DIR=/tmp/spectra_inspector_writes
    depends_on:
      - fastapi

  fastapi:
    build: ./packages/spectra_inspector_server/
    env_file: ./packages/spectra_inspector_server/.env
    volumes:
      # Nothing writes back to the data tree, so mount it read-only. Both
      # paths come from packages/spectra_inspector_server/.env.
      - type: bind
        source: ${SPECTRA_INSPECTOR_HOST_DATA_ROOT:?not set in the server .env}
        target: ${SPECTRA_INSPECTOR_DATA_ROOT:?not set in the server .env}
        read_only: true
