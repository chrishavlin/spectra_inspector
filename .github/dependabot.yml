version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Security updates only: the limit of 0 disables version-update PRs.
  - package-ecosystem: uv
    directories:
      - /packages/spectra_inspector
      - /packages/spectra_inspector_server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
