version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directories:
      - /packages/spectra_inspector
      - /packages/spectra_inspector_server
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /packages/spectra_inspector
      - /packages/spectra_inspector_server
    schedule:
      interval: monthly
