name: Lockfile Synchronization Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check spectra_inspector lockfile
        working-directory: packages/spectra_inspector
        run: uv lock --check

      - name: Check spectra_inspector_server lockfile
        working-directory: packages/spectra_inspector_server
        run: uv lock --check
