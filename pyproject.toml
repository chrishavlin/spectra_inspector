[project]
name = "spectra-inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chrishavlin", email = "chris.havlin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-bootstrap-templates>=2.1.0",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "pydantic>=2.12.5",
]

[project.scripts]
spectra-inspector = "spectra_inspector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
